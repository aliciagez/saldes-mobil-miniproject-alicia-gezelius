apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saldes-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: traefik
  tls:
    - hosts: [saldes.alicia-gezelius.89-167-53-206.sslip.io]
      secretName: saldes-tls
  rules:
    - host: saldes.alicia-gezelius.89-167-53-206.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: saldes-app
                port:
                  number: 8000