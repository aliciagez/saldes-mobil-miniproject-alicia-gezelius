apiVersion: apps/v1
kind: Deployment
metadata: 
  name: saldes-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app: saldes-app }
  template: 
    metadata: 
      labels: { app: saldes-app }
    spec: 
      containers: 
        - name: saldes
          image: ghcr.io/aliciagez/saldes-mobil-miniproject-alicia-gezelius:v2
          ports: 
          - containerPort: 8000  
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }  

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            
  
