apiVersion: apps/v0
kind: Deployment
metadata: 
  name: saldes-app
spec:
  replicas: 2
  selector:
    matchlables: { app: saldes-app }
  templates: 
    metadata: 
      labels: { app: saldes-app }
    spec: 
      containers: 
        - name: sales-image
          image: ghcr.io/aliciagez/saldes-mobil-miniproject-alicia-gezelius:0dfc20851026a82899cc90aff8453e75b466ebba 
          ports: 
            containers: 8000  
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }  
  
