name: CI

on: 
  push:
    paths:
      - "src/**"
      - "data/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "kontroller/**"
      - "Dockerfile"
      - "k8s/**"

  pull_request:
    branches: [main]
    paths: 
      - "src/**"
      - "data/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "kontroller/**"
      - "Dockerfile"
      - "k8s/**"


  workflow_dispatch:
    inputs: 
      datafil:
        description: "Välj vilken kundfil som ska valideras"
        required: true
        default: "data/kundbas.csv"
        type: choice
        options:
          - "data/kundbas.csv"
          - "data/kundbas_ny_leverans.csv"

  schedule:
    - cron: "0 6 * * 1"
      timezone: "Europe/Stockholm"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    
    steps: 
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup 
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv run pytest --ignore=tests/test_api_contract.py --ignore=tests/test_smoke.py

  validera_data:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup
        with:
          python-version: "3.11"

      - run: uv run python kontroller/schema.py "${{ inputs.datafil || 'data/kundbas.csv' }}"

  train:
    needs: [test, validera_data]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup
        with:
          python-version: "3.11"  

      - run: uv run python -m churn.model

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: modell-${{ github.sha }}
          path: outputs/


  utvardera:
    needs: train
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup 
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - run: uv run python -m churn.evaluate

      - name: Visa mätvärden i Summary
        run: |
          echo "## Modellens mätvärden" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat outputs/matvarden.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY


  versionera_modell:
    needs: utvardera 
    runs-on: ubuntu-24.04
    steps:
     - name: download validated model
       uses: actions/download-artifact@v4
       with:
         name: modell-${{ github.sha }}
         path: approved-modell/

     - name: save approved modell version  
       uses: actions/upload-artifact@v4 
       with:
        name: approved-modell-${{ github.sha }}
        path: approved-modell/
        if-no-files-found: error 

  api_contract_tests:
    needs: versionera_modell
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup
        with:
          python-version: "3.11"

      - name: Download approved model
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: approved-modell-${{ github.sha }}
          path: approved-modell/

      - name: Run API contract tests
        run: uv run pytest tests/test_api_contract.py -v

  docker:
    needs: [versionera_modell, api_contract_tests]
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      actions: read
      packages: write
 
  deploy productions:
    needs: docker 
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    enviorment: production

    steps: 
        uses: actions/checkout@v4 
        uses: azure/setup-kubectl@v4 
        env: 
          KUBE_CONFIG_SECRET: ${{ secrets.KUBE_SECRET}}
        run: | 
          kubect --context=mlops-ht26 -n alicia-gezelius \
            set image deployment/saldes-app \
             


  ringlista:
    needs: versionera_modell 
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup 
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 
        with:
          name: approved-modell-${{ github.sha }}
          path: outputs/

      - run: uv run python -m churn.score

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 
        with:
          name: ringlista-${{ github.sha }}
          path: outputs/ringlista.csv
          
